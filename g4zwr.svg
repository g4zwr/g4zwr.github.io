<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" width="640" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>g4zwr</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" x="40" y="120">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.09"/>
    </pattern>

    <!-- tall, squared letters (stroke 16, height 260) -->
    <g id="gL" fill="none" stroke="#fff" stroke-width="16"><path d="M56 130H8V8H56V252H8V212"/></g>
    <g id="fL" fill="none" stroke="#fff" stroke-width="16"><path d="M8 0V146H64M56 0V260"/></g>
    <g id="zL" fill="#fff"><path d="M0 0H64V16L24 244H64V260H0V244H6L46 16H0Z"/></g>
    <g id="wL" fill="none" stroke="#fff" stroke-width="16"><path d="M8 0V252H84V0M46 252V84"/></g>
    <g id="rL" fill="none" stroke="#fff" stroke-width="16"><path d="M8 260V8H56V72"/></g>

    <g id="word">
      <use href="#gL" xlink:href="#gL" x="90" y="190"/>
      <use href="#fL" xlink:href="#fL" x="182" y="190"/>
      <use href="#zL" xlink:href="#zL" x="274" y="190"/>
      <use href="#wL" xlink:href="#wL" x="366" y="190"/>
      <use href="#rL" xlink:href="#rL" x="486" y="190"/>
    </g>

    <!-- per-letter wipe reveals (top to bottom) -->
    <clipPath id="c0"><rect x="80" y="190" width="84" height="0"><animate attributeName="height" values="0;262" keyTimes="0;1" calcMode="spline" keySplines="0.7 0 0.3 1" begin="1.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="172" y="190" width="84" height="0"><animate attributeName="height" values="0;262" keyTimes="0;1" calcMode="spline" keySplines="0.7 0 0.3 1" begin="1.34s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="264" y="190" width="84" height="0"><animate attributeName="height" values="0;262" keyTimes="0;1" calcMode="spline" keySplines="0.7 0 0.3 1" begin="1.48s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="356" y="190" width="112" height="0"><animate attributeName="height" values="0;262" keyTimes="0;1" calcMode="spline" keySplines="0.7 0 0.3 1" begin="1.62s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="476" y="190" width="84" height="0"><animate attributeName="height" values="0;262" keyTimes="0;1" calcMode="spline" keySplines="0.7 0 0.3 1" begin="1.76s" dur="0.7s" fill="freeze"/></rect></clipPath>

    <!-- glitch bands -->
    <clipPath id="b1"><rect x="40" y="262" width="560" height="26"/></clipPath>
    <clipPath id="b2"><rect x="40" y="368" width="560" height="18"/></clipPath>
  </defs>

  <!-- black only inside the box; everything outside is transparent -->
  <rect x="36" y="116" width="568" height="408" fill="#000" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0s" dur="0.4s" fill="freeze"/>
  </rect>

  <!-- grid inside frame -->
  <rect x="40" y="120" width="560" height="400" fill="url(#grid)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="1s" fill="freeze"/>
  </rect>

  <!-- opening line -->
  <rect x="320" y="319" width="0" height="2" fill="#fff">
    <animate attributeName="x" values="320;40" begin="0s" dur="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/>
    <animate attributeName="width" values="0;560" begin="0s" dur="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" begin="1s" dur="0.2s" fill="freeze"/>
  </rect>

  <!-- frame draws itself -->
  <rect x="40" y="120" width="560" height="400" fill="none" stroke="#fff" stroke-opacity="0.6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0" begin="0.3s" dur="0.9s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#fff" stroke-width="4" opacity="0">
    <set attributeName="opacity" to="1" begin="1s" fill="freeze"/>
    <path d="M40 152V120H72"/><path d="M568 120H600V152"/>
    <path d="M600 488V520H568"/><path d="M72 520H40V488"/>
  </g>

  <!-- corner pixels -->
  <g fill="#fff">
    <rect x="52" y="132" width="8" height="8" opacity="0"><set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/><animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.1;0.2;1" begin="3s" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="580" y="132" width="8" height="8" opacity="0"><set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/><animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.1;0.2;1" begin="3.6s" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="580" y="500" width="8" height="8" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/><animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.1;0.2;1" begin="4.2s" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="52" y="500" width="8" height="8" opacity="0"><set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/><animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.1;0.2;1" begin="4.8s" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- letters, revealed one by one -->
  <g clip-path="url(#c0)"><use href="#gL" xlink:href="#gL" x="90" y="190"/></g>
  <g clip-path="url(#c1)"><use href="#fL" xlink:href="#fL" x="182" y="190"/></g>
  <g clip-path="url(#c2)"><use href="#zL" xlink:href="#zL" x="274" y="190"/></g>
  <g clip-path="url(#c3)"><use href="#wL" xlink:href="#wL" x="366" y="190"/></g>
  <g clip-path="url(#c4)"><use href="#rL" xlink:href="#rL" x="486" y="190"/></g>

  <!-- leading edge bars -->
  <g fill="#fff">
    <rect x="84" y="190" width="76" height="3" opacity="0"><animate attributeName="y" values="190;448" begin="1.2s" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.92;1" begin="1.2s" dur="0.7s" fill="freeze"/></rect>
    <rect x="176" y="190" width="76" height="3" opacity="0"><animate attributeName="y" values="190;448" begin="1.34s" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.92;1" begin="1.34s" dur="0.7s" fill="freeze"/></rect>
    <rect x="268" y="190" width="76" height="3" opacity="0"><animate attributeName="y" values="190;448" begin="1.48s" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.92;1" begin="1.48s" dur="0.7s" fill="freeze"/></rect>
    <rect x="360" y="190" width="104" height="3" opacity="0"><animate attributeName="y" values="190;448" begin="1.62s" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.92;1" begin="1.62s" dur="0.7s" fill="freeze"/></rect>
    <rect x="480" y="190" width="76" height="3" opacity="0"><animate attributeName="y" values="190;448" begin="1.76s" dur="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.3 1" fill="freeze"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.92;1" begin="1.76s" dur="0.7s" fill="freeze"/></rect>
  </g>

  <!-- block row under the letters -->
  <g fill="#fff">
    <rect x="117" y="478" width="10" height="10" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1;1" keyTimes="0;0.04;0.08;1" begin="5s" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="209" y="478" width="10" height="10" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.6s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1;1" keyTimes="0;0.04;0.08;1" begin="5.15s" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="301" y="478" width="10" height="10" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1;1" keyTimes="0;0.04;0.08;1" begin="5.3s" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="407" y="478" width="10" height="10" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1;1" keyTimes="0;0.04;0.08;1" begin="5.45s" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="513" y="478" width="10" height="10" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.9s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0.15;1;1" keyTimes="0;0.04;0.08;1" begin="5.6s" dur="5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- idle glitch slices -->
  <g clip-path="url(#b1)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;0.8;0.81;0.84;0.86;0.89;1" begin="4.5s" dur="6s" repeatCount="indefinite"/>
    <use href="#word" xlink:href="#word" x="14"/>
  </g>
  <g clip-path="url(#b2)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;0.82;0.83;0.85;0.87;0.9;1" begin="4.5s" dur="6s" repeatCount="indefinite"/>
    <use href="#word" xlink:href="#word" x="-14"/>
  </g>

  <!-- inversion sweep: intro finale, then repeats -->
  <rect x="40" y="120" width="36" height="400" fill="#fff" opacity="0" style="mix-blend-mode:difference">
    <animate attributeName="x" values="40;564;564" keyTimes="0;0.1;1" begin="2.7s" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.095;0.1;1" begin="2.7s" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
